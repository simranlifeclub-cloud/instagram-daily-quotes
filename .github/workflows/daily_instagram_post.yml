name: Auto Instagram Reels Daily Publisher (2 Reels/Day - Growth Optimized)

on:
  schedule:
    # 2 Daily High-Impact Schedules in Indian Standard Time (IST) [UTC = IST - 5:30]
    # Morning Prime: 07:30 AM IST (02:00 UTC) - Morning Mindset & Ambition
    - cron: '0 2 * * *'
    # Evening Peak: 07:30 PM IST (14:00 UTC) - Evening Reflection & Discipline
    - cron: '0 14 * * *'

  workflow_dispatch:
    inputs:
      reel_type:
        description: 'Choose Reel to publish'
        required: true
        default: 'reality_check'
        type: choice
        options:
          - 'reality_check'
          - 'daily'

permissions:
  contents: write

jobs:
  publish_reel:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Font Rendering Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 libharfbuzz0b

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "instagrapi[video]>=3.0.2" moviepy pillow numpy scipy requests edge-tts uharfbuzz freetype-py

      - name: Generate & Publish Reel to Instagram
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_SESSION_DATA: ${{ secrets.IG_SESSION_DATA }}
          REEL_TYPE: ${{ github.event.inputs.reel_type }}
        run: |
          if [ "$REEL_TYPE" = "reality_check" ]; then
            echo "[INFO] Publishing dedicated multi-scene narrative reel: The Reality Check & Reset..."
            python post_with_instagrapi.py --storyboard reality_check
          else
            python post_with_instagrapi.py
          fi

      - name: Save Session & Update Posting History
        run: |
          git config --global user.name "Instagram Reels Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A history.json session.json output/ assets/
          git commit -m "Auto-post reel to Instagram [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
