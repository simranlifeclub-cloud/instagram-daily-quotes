name: Daily Motivational Instagram Post

on:
  schedule:
    # Runs every day at 02:30 UTC (08:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Instagram Poster
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSION_DATA: ${{ secrets.IG_SESSION_DATA }}
        run: |
          python post_with_instagrapi.py

      - name: Commit and push posting history and session
        run: |
          git config --global user.name "Instagram Automation Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json session.json output/
          git commit -m "Update post history and session [skip ci]" || echo "No changes to commit"
          git push
