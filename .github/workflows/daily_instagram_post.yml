name: Auto Daily Reels & YouTube Shorts Publisher (2 Reels/Day - Growth Optimized)

on:
  schedule:
    # 2 Daily High-Impact Schedules in Indian Standard Time (IST) [UTC = IST - 5:30]
    # Post 1 (Morning Prime): 07:30 AM IST (02:00 UTC) - Morning Mindset & Purpose
    - cron: '0 2 * * *'
    # Post 2 (Evening Peak): 07:30 PM IST (14:00 UTC) - Evening Reflection & Inner Peace
    - cron: '0 14 * * *'

  workflow_dispatch:
    inputs:
      reel_type:
        description: 'Choose Video Content to publish'
        required: true
        default: 'daily'
        type: choice
        options:
          - 'daily'
          - 'reality_check'
      target_platform:
        description: 'Destination Platforms'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'instagram_only'
          - 'youtube_only'
      language:
        description: 'Quote Language'
        required: true
        default: 'hi'
        type: choice
        options:
          - 'hi'
          - 'en'

permissions:
  contents: write

jobs:
  publish_reel:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Font Rendering Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libraqm0 libharfbuzz0b

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "instagrapi[video]>=3.0.2" moviepy pillow numpy scipy requests edge-tts uharfbuzz freetype-py google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Generate & Publish to Instagram Reels & YouTube Shorts
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          IG_SESSION_DATA: ${{ secrets.IG_SESSION_DATA }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          REEL_TYPE: ${{ github.event.inputs.reel_type || 'daily' }}
          TARGET_PLATFORM: ${{ github.event.inputs.target_platform || 'all' }}
          SELECTED_LANG: ${{ github.event.inputs.language || 'hi' }}
        run: |
          EXTRA_FLAGS=""
          if [ "$TARGET_PLATFORM" = "instagram_only" ]; then
            EXTRA_FLAGS="--no-youtube"
          elif [ "$TARGET_PLATFORM" = "youtube_only" ]; then
            EXTRA_FLAGS="--youtube-only"
          fi

          if [ "$REEL_TYPE" = "reality_check" ]; then
            echo "[INFO] Publishing dedicated multi-scene narrative reel & short: The Reality Check & Reset..."
            python post_with_instagrapi.py --storyboard reality_check $EXTRA_FLAGS
          else
            echo "[INFO] Publishing daily wellness reel in language: $SELECTED_LANG..."
            python post_with_instagrapi.py --lang "$SELECTED_LANG" $EXTRA_FLAGS
          fi

      - name: Save Session & Update Posting History
        run: |
          git config --global user.name "Instagram & YouTube Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json session.json
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-post reel & short to Instagram/YouTube [skip ci]"
            git pull --rebase -X theirs origin main || git pull --rebase origin main || true
            git push origin main || true
          else
            echo "No changes to commit"
          fi

